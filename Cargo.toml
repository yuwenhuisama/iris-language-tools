[workspace]
members = ["analysis", "formatter", "server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
iris-analysis = { path = "analysis" }
iris-builtins = { path = "../Iris-Language/crates/iris-builtins" }
iris-formatter = { path = "formatter" }
iris-lexer = { path = "../Iris-Language/crates/iris-lexer" }
iris-parser = { path = "../Iris-Language/crates/iris-parser" }
iris-syntax = { path = "../Iris-Language/crates/iris-syntax" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
